<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong - Online Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Courier, monospace;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .menu-btn {
            pointer-events: auto;
            background: rgba(20, 20, 35, 0.9);
            color: white;
            border: 2px solid #00e5ff;
            padding: 12px 32px;
            margin: 8px;
            font-size: 22px;
            font-family: 'Segoe UI', monospace;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(10px);
            min-width: 220px;
            text-align: center;
        }

        .menu-btn:hover {
            background: #00e5ff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px #00e5ff;
        }

        .menu-btn.selected {
            background: #ff9800;
            border-color: #ff9800;
            color: #000;
        }

        #online-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }

        #player-name {
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #111;
            color: white;
            text-align: center;
        }

        #leaderboard {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="menu-overlay"></div>
    <div id="leaderboard"></div>
    <script>
        // WebSocket URL-i avtomatik olaraq təyin olunur (eyni server)
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const SERVER_URL = `${protocol}://${window.location.host}`;
        const WIN_SCORE = 11;
        const DEUCE_GAP = 2;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const menuOverlay = document.getElementById('menu-overlay');
        const leaderboardDiv = document.getElementById('leaderboard');

        let gameState = 'menu';
        let gameMode = null;
        let difficulty = 'medium';
        let playerName = 'Player';
        let ws = null;
        let onlineOpponent = null;
        let onlineSide = null;

        let leftPaddle, rightPaddle, ball, particles = [];
        let scores = { left: 0, right: 0 };
        let winner = null;
        const keys = {};

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initPositions();
        }
        window.addEventListener('resize', resize);

        function initPositions() {
            const pw = Math.max(canvas.width * 0.012, 8);
            const ph = Math.max(canvas.height * 0.16, 55);
            const r = Math.max(Math.min(canvas.width, canvas.height) * 0.015, 6);
            leftPaddle = { x: canvas.width * 0.03, y: canvas.height / 2 - ph / 2, w: pw, h: ph, color: '#00e5ff' };
            rightPaddle = { x: canvas.width - canvas.width * 0.03 - pw, y: canvas.height / 2 - ph / 2, w: pw, h: ph, color: '#ff5252' };
            ball = { x: canvas.width / 2, y: canvas.height / 2, r, vx: 0, vy: 0, speed: canvas.width * 0.0055 };
            resetBall();
            particles = [];
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            const angle = (Math.random() - 0.5) * 0.8;
            const dir = Math.random() > 0.5 ? 1 : -1;
            ball.vx = dir * ball.speed * Math.cos(angle);
            ball.vy = ball.speed * Math.sin(angle);
        }

        function buildMenu() {
            menuOverlay.innerHTML = '';
            [{ text: '1 Player (vs Bot)', action: () => startGame('bot') },
            { text: '2 Players (Local)', action: () => startGame('local') },
            { text: 'Online Multiplayer', action: () => showOnlinePanel() }]
                .forEach(b => {
                    const btn = document.createElement('div');
                    btn.className = 'menu-btn';
                    btn.textContent = b.text;
                    btn.onclick = b.action;
                    menuOverlay.appendChild(btn);
                });
            const diffLabel = document.createElement('div');
            diffLabel.style.color = '#aaa'; diffLabel.style.marginTop = '15px';
            diffLabel.textContent = 'Difficulty (for Bot):';
            menuOverlay.appendChild(diffLabel);
            const diffRow = document.createElement('div');
            diffRow.style.display = 'flex'; diffRow.style.gap = '10px'; diffRow.style.marginTop = '8px';
            ['easy', 'medium', 'hard'].forEach(d => {
                const dbtn = document.createElement('div');
                dbtn.className = 'menu-btn' + (difficulty === d ? ' selected' : '');
                dbtn.textContent = d.toUpperCase();
                dbtn.onclick = () => { difficulty = d; buildMenu(); };
                diffRow.appendChild(dbtn);
            });
            menuOverlay.appendChild(diffRow);
            const panel = document.createElement('div');
            panel.id = 'online-panel';
            panel.innerHTML = `
                <input id="player-name" placeholder="Your Name" value="${playerName}">
                <div class="menu-btn" id="connect-btn">Connect & Play</div>
                <div style="color:#aaa; margin-top:8px;">Waiting for opponent...</div>
            `;
            menuOverlay.appendChild(panel);
            document.getElementById('connect-btn').onclick = connectOnline;
            document.getElementById('player-name').oninput = e => playerName = e.target.value;
        }

        function showOnlinePanel() {
            document.getElementById('online-panel').style.display = 'flex';
        }

        function startGame(mode) {
            gameMode = mode;
            scores = { left: 0, right: 0 };
            winner = null;
            gameState = 'playing';
            menuOverlay.style.display = 'none';
            initPositions();
            if (mode === 'online') {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert('Not connected to server!');
                    gameState = 'menu';
                    menuOverlay.style.display = 'flex';
                    return;
                }
                ws.send(JSON.stringify({ type: 'join', name: playerName }));
            }
        }

        function connectOnline() {
            playerName = document.getElementById('player-name').value || 'Player';
            if (ws) ws.close();
            ws = new WebSocket(SERVER_URL);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'register', name: playerName }));
            };
            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                if (data.type === 'opponent') {
                    onlineOpponent = data.opponent;
                    onlineSide = data.side;
                    startGame('online');
                } else if (data.type === 'state') {
                    if (gameMode === 'online' && gameState === 'playing') {
                        ball.x = data.ball.x; ball.y = data.ball.y;
                        ball.vx = data.ball.vx; ball.vy = data.ball.vy;
                        if (onlineSide === 'left') rightPaddle.y = data.rightY;
                        else leftPaddle.y = data.leftY;
                        scores = data.scores;
                        if (data.winner) {
                            winner = data.winner;
                            gameState = 'gameover';
                            updateLeaderboard();
                        }
                    }
                } else if (data.type === 'leaderboard') {
                    renderLeaderboard(data.leaders);
                }
            };
            ws.onclose = () => { };
        }

        function updateLeaderboard() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'getLeaderboard' }));
            }
        }

        function renderLeaderboard(leaders) {
            leaderboardDiv.innerHTML = '<b>🏆 Global Ranking</b><br>';
            if (!leaders || leaders.length === 0) {
                leaderboardDiv.innerHTML += 'No data yet.';
                return;
            }
            leaders.forEach((p, i) => {
                leaderboardDiv.innerHTML += `${i + 1}. ${p.name} - Wins: ${p.wins} Losses: ${p.losses}<br>`;
            });
        }

        function update() {
            if (gameState !== 'playing') return;
            if (gameMode === 'online') {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const paddleY = onlineSide === 'left' ? leftPaddle.y : rightPaddle.y;
                    ws.send(JSON.stringify({ type: 'input', y: paddleY, side: onlineSide }));
                }
                return;
            }
            const speed = canvas.height * 0.008;
            if (gameMode === 'bot') {
                if (keys['w']) leftPaddle.y -= speed;
                if (keys['s']) leftPaddle.y += speed;
            } else if (gameMode === 'local') {
                if (keys['w']) leftPaddle.y -= speed;
                if (keys['s']) leftPaddle.y += speed;
                if (keys['ArrowUp']) rightPaddle.y -= speed;
                if (keys['ArrowDown']) rightPaddle.y += speed;
            }
            leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.h, leftPaddle.y));
            rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.h, rightPaddle.y));
            if (gameMode === 'bot') {
                const aiSpeed = { easy: 0.04, medium: 0.07, hard: 0.11 }[difficulty];
                const target = ball.y - rightPaddle.h / 2;
                rightPaddle.y += (target - rightPaddle.y) * aiSpeed;
                rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.h, rightPaddle.y));
            }
            ball.x += ball.vx; ball.y += ball.vy;
            if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) ball.vy *= -1;
            const hitPaddle = (p) => ball.x + ball.r > p.x && ball.x - ball.r < p.x + p.w &&
                ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h;
            if (ball.vx < 0 && hitPaddle(leftPaddle)) {
                const hit = (ball.y - (leftPaddle.y + leftPaddle.h / 2)) / (leftPaddle.h / 2);
                ball.vx = Math.abs(ball.vx);
                ball.vy = hit * ball.speed * 0.8;
                ball.x = leftPaddle.x + leftPaddle.w + ball.r;
            } else if (ball.vx > 0 && hitPaddle(rightPaddle)) {
                const hit = (ball.y - (rightPaddle.y + rightPaddle.h / 2)) / (rightPaddle.h / 2);
                ball.vx = -Math.abs(ball.vx);
                ball.vy = hit * ball.speed * 0.8;
                ball.x = rightPaddle.x - ball.r;
            }
            if (ball.x + ball.r < 0) { scores.right++; checkWin(); resetBall(); }
            else if (ball.x - ball.r > canvas.width) { scores.left++; checkWin(); resetBall(); }
        }

        function checkWin() {
            if (scores.left >= WIN_SCORE && scores.left - scores.right >= DEUCE_GAP) {
                winner = 'Left Player'; gameState = 'gameover';
            } else if (scores.right >= WIN_SCORE && scores.right - scores.left >= DEUCE_GAP) {
                winner = 'Right Player'; gameState = 'gameover';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.setLineDash([8, 12]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            [leftPaddle, rightPaddle].forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color; ctx.shadowBlur = 12;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.shadowBlur = 0;
            });
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 15;
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.font = `bold ${canvas.width * 0.06}px 'Segoe UI', monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = leftPaddle.color; ctx.fillText(scores.left, canvas.width / 4, canvas.height * 0.1);
            ctx.fillStyle = rightPaddle.color; ctx.fillText(scores.right, 3 * canvas.width / 4, canvas.height * 0.1);
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = `${canvas.width * 0.06}px 'Segoe UI', monospace`;
                ctx.fillText(`${winner} Wins!`, canvas.width / 2, canvas.height / 2 - 30);
                ctx.font = `${canvas.width * 0.03}px monospace`;
                ctx.fillText('Press SPACE to return to menu', canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }

        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' && gameState === 'gameover') {
                gameState = 'menu'; menuOverlay.style.display = 'flex'; buildMenu();
                scores = { left: 0, right: 0 }; winner = null;
            }
            if (e.key === 'Escape') {
                if (gameMode === 'online' && ws) ws.close();
                gameState = 'menu'; menuOverlay.style.display = 'flex'; buildMenu();
            }
        });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        resize();
        buildMenu();
        menuOverlay.style.display = 'flex';
        loop();
    </script>
</body>

</html>
